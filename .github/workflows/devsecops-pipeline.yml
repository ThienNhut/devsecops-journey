name: DevSecOps Automated CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cấp quyền OIDC để kết nối AWS không dùng Access Key cố định (ISC2 Standard)
permissions:
  id-token: write
  contents: read

jobs:
  # =================================================================
  # PHASE 1A: INFRASTRUCTURE & CONFIGURATION LINTING
  # =================================================================
  lint-iac-and-ansible:
    name: "🛠️ IaC & Config Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Audit Terraform Code (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: stage2-terraform
          framework: terraform
          soft_fail: false

      - name: Audit Ansible Playbook (Ansible-Lint)
        uses: ansible/ansible-lint@main
        with:
          path: "stage3-ansible"

  # =================================================================
  # PHASE 1B: SAST & DEPENDENCY VULNERABILITY AUDIT
  # =================================================================
  sast-and-vulnerability-scan:
    name: "🛡️ SAST & Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Bandit (Python SAST)
        run: |
          pip install bandit
          bandit -r stage1-fastapi/ -ll

      - name: Run Trivy Filesystem Scan (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'stage1-fastapi'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # =================================================================
  # PHASE 1C: SECRET LEAK SCANNING (ZERO TRUST)
  # =================================================================
  secret-scanning:
    name: "🔑 Secret Leak Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog-action@main
        with:
          extra_args: --only-verified

  # =================================================================
  # PHASE 2: BUILD, TRIVY SCAN & PUSH DOCKER IMAGE TO AWS ECR
  # =================================================================
  build-and-push-ecr:
    name: "🐳 Build, Security Scan & Push ECR"
    needs: [lint-iac-and-ansible, sast-and-vulnerability-scan, secret-scanning]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::739275451281:role/github-actions-ecr-role
          aws-region: ap-southeast-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image (Local Load)
        uses: docker/build-push-action@v5
        with:
          context: ./stage1-fastapi
          file: ./stage1-fastapi/Dockerfile
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/stage2-fastapi-tf:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/stage2-fastapi-tf:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Container Image Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/stage2-fastapi-tf:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to AWS ECR
        uses: docker/build-push-action@v5
        with:
          context: ./stage1-fastapi
          file: ./stage1-fastapi/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/stage2-fastapi-tf:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/stage2-fastapi-tf:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
