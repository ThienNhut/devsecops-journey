name: DevSecOps Automated CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # =================================================================
  # PHASE 1A: INFRASTRUCTURE & CONFIGURATION LINTING
  # =================================================================
  lint-iac-and-ansible:
    name: "🛠️ IaC & Config Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Audit Terraform Code (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: stage2-terraform
          framework: terraform
          skip_check: CKV_AWS_136
          soft_fail: false

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Ansible Playbook (Ansible-Lint)
        run: |
          pip install ansible-lint
          ansible-lint stage3-ansible/deploy.yml

  # =================================================================
  # PHASE 1B: SAST & DEPENDENCY VULNERABILITY AUDIT
  # =================================================================
  sast-and-vulnerability-scan:
    name: "🛡️ SAST & Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Bandit (Python SAST)
        run: |
          pip install bandit
          bandit -r stage1-fastapi/ -ll

      - name: Run Trivy Filesystem Scan (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'stage1-fastapi'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # =================================================================
  # PHASE 1C: SECRET LEAK SCANNING (ZERO TRUST)
  # =================================================================
  secret-scanning:
    name: "🔑 Secret Leak Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =================================================================
  # PHASE 2: BUILD, TRIVY SCAN & PUSH DOCKER IMAGE TO AWS ECR
  # =================================================================
  build-and-push-ecr:
    name: "🐳 Build, Security Scan & Push ECR"
    needs: [lint-iac-and-ansible, sast-and-vulnerability-scan, secret-scanning]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::739275451281:role/github-actions-ecr-role
          aws-region: ap-southeast-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image (Local Load)
        uses: docker/build-push-action@v5
        with:
          context: ./stage1-fastapi
          file: ./stage1-fastapi/Dockerfile
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/stage2-fastapi-tf:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/stage2-fastapi-tf:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Container Image Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/stage2-fastapi-tf:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to AWS ECR
        uses: docker/build-push-action@v5
        with:
          context: ./stage1-fastapi
          file: ./stage1-fastapi/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/stage2-fastapi-tf:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/stage2-fastapi-tf:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =================================================================
  # PHASE 3: CONTINUOUS DEPLOYMENT (ANSIBLE TO EC2)
  # =================================================================
  deploy-to-ec2:
    name: "🚀 Deploy to AWS EC2 via Ansible"
    needs: [build-and-push-ecr]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::739275451281:role/github-actions-ecr-role
          aws-region: ap-southeast-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up SSH Private Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: pip install ansible

      - name: Execute Ansible CD Playbook
        run: |
          ansible-playbook -i "${{ secrets.EC2_HOST }}," \
            -u ${{ secrets.EC2_USERNAME }} \
            --private-key ~/.ssh/id_rsa \
            -e "ecr_registry=${{ steps.login-ecr.outputs.registry }}" \
            -e "image_tag=${{ github.sha }}" \
            stage3-ansible/deploy.yml

      # 3. REVOKE WHITELIST: XÓA IP RUNNER KHỎI FIREWALL NGAY KHI XONG
      - name: Revoke Runner IP from Security Group (ISC2 Sanitization)
        if: always() && steps.ip.outputs.runner_ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id sg-04f439aceae599aab \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.runner_ip }}/32

      - name: Cleanup SSH Key (ISC2 Sanitization)
        if: always()
        run: rm -f ~/.ssh/id_rsa
